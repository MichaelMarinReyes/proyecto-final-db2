services:
  mongo:
    image: mongo:7
    container_name: db2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./infra/mongo/.env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: db2-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    env_file:
      - ./infra/neo4j/.env
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:
