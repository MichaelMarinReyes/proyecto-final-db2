server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: proyecto-final-db2
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/evaluaciones}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:evaluaciones2026}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null

app:
  etl:
    batch-size: ${ETL_BATCH_SIZE:1000}
    temp-dir: ${ETL_TEMP_DIR:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

logging:
  level:
    com.db2.proyectofinaldb2: INFO
